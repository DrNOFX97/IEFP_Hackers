<!DOCTYPE html>
<html lang="pt">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kali Linux — Top 15 Ferramentas</title>
<link rel="stylesheet" href="kali-tools.css">
</head>
<body>

<header>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" title="Alternar tema">🌙</button>
    <button class="icon-btn" id="printBtn" title="Imprimir / PDF">🖨️</button>
  </div>
  <h1>Kali Linux — Top 15 Ferramentas</h1>
  <p>As ferramentas essenciais para testes de penetração, organizadas por categoria</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 Pesquisar ferramenta, categoria ou descrição...">
  <select id="filter">
    <option value="">Todas as categorias</option>
  </select>
  <button class="toggle-fav" id="favToggle">★ Só favoritos</button>

<div class="grid" id="grid"></div>
<div class="empty is-hidden" id="empty">Nenhuma ferramenta encontrada.</div>

<footer>
  Uso exclusivo em sistemas com autorização explícita por escrito.
</footer>

<script src="kali-tools.js"></script>
